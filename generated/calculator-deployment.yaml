apiVersion: apps/v1
kind: Deployment

metadata:
  name: calculator-deployment
  namespace: default

  labels:
    app: calculator

spec:
  replicas: 2

  selector:
    matchLabels:
      app: calculator

  template:
    metadata:
      labels:
        app: calculator

    spec:
      imagePullSecrets:
        - name: private-registry-credentials

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule

          labelSelector:
            matchLabels:
              app: calculator

      containers:
        - name: calculator
          image: ghcr.io/salmarashedy/calculator:dc285dea963a
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: 500m
              memory: 65Mi

            limits:
              cpu: 1000m
              memory: 1024Mi