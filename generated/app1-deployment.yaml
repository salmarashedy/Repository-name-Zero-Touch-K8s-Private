apiVersion: apps/v1
kind: Deployment

metadata:
  name: app1-deployment
  namespace: default

  labels:
    app: app1

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app1

  template:
    metadata:
      labels:
        app: app1

    spec:
      imagePullSecrets:
        - name: private-registry-credentials

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule

          labelSelector:
            matchLabels:
              app: app1

      containers:
        - name: app1
          image: ghcr.io/salmarashedy/app1:ed3458c5832a
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: 500m
              memory: 256Mi

            limits:
              cpu: 1000m
              memory: 1024Mi