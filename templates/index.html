<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zero-Touch Kubernetes Deployment</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="page-container">
        <section class="deployment-card">
            <header class="card-header">
                <div class="logo">☁</div>

                <div>
                    <h1>Zero-Touch Kubernetes Deployment</h1>

                    <p>
                        Enter the cluster and application settings to start
                        an automated deployment.
                    </p>
                </div>
            </header>

            <form method="POST" action="/deploy">
                <section class="form-section">
                    <h2>User Information</h2>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="user_name">Name</label>

                            <input
                                type="text"
                                id="user_name"
                                name="user_name"
                                placeholder="Enter your name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="example@gmail.com"
                                required
                            >
                        </div>
                    </div>
                </section>

                <section class="form-section">
                    <h2>Cluster Configuration</h2>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cluster_name">Cluster name</label>

                            <input
                                type="text"
                                id="cluster_name"
                                name="cluster_name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="node_count">Number of nodes</label>

                            <input
                                type="number"
                                id="node_count"
                                name="node_count"
                                required
                            >
                        </div>
                    </div>
                </section>

                <section class="form-section">
                    <h2>Application Configuration</h2>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="app_name">Application name</label>

                            <input
                                type="text"
                                id="app_name"
                                name="app_name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="image">Docker image</label>

                            <input
                                type="text"
                                id="image"
                                name="image"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="replicas">Number of replicas</label>

                            <input
                                type="number"
                                id="replicas"
                                name="replicas"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="port">Container port</label>

                            <input
                                type="number"
                                id="port"
                                name="port"
                                required
                            >
                        </div>
                    </div>
                </section>

                <section class="form-section">
                    <h2>Resource Configuration</h2>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cpu_request">CPU request</label>

                            <input
                                type="text"
                                id="cpu_request"
                                name="cpu_request"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="cpu_limit">CPU limit</label>

                            <input
                                type="text"
                                id="cpu_limit"
                                name="cpu_limit"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="memory_request">
                                Memory request
                            </label>

                            <input
                                type="text"
                                id="memory_request"
                                name="memory_request"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="memory_limit">Memory limit</label>

                            <input
                                type="text"
                                id="memory_limit"
                                name="memory_limit"
                                required
                            >
                        </div>
                    </div>
                </section>

                <button type="submit" class="deploy-button">
                    Start Deployment
                </button>
            </form>
        </section>
    </main>
</body>
</html>
