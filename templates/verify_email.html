{% extends "base.html" %}

{% block heading %}Verify your email{% endblock %}

{% block intro %}
    Enter the code sent to {{ email }}. It expires after 2 minutes.
{% endblock %}

{% block content %}
    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group form-section">
            <label for="verification_code">Six-digit code</label>
            <input
                id="verification_code"
                name="verification_code"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                required
            >
        </div>

        <button class="deploy-button" type="submit">Verify</button>
    </form>

    <a class="back-link" href="{{ url_for('identity') }}">Start again</a>
{% endblock %}
